{# Parameter: text (label), color (success|warning|danger|info|neutral) #}
<span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium
  {% if color == 'success' %}bg-green-100 text-green-700
  {% elif color == 'warning' %}bg-yellow-100 text-yellow-700
  {% elif color == 'danger' %}bg-red-100 text-red-700
  {% elif color == 'info' %}bg-blue-100 text-blue-700
  {% else %}bg-slate-100 text-slate-700
  {% endif %}">
  {{ text }}
</span>
