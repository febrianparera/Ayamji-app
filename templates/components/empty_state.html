{# Parameter: icon (default inbox), title, description (opsional) #}
<div class="flex flex-col items-center justify-center py-16 text-center">
  <div class="p-4 bg-slate-100 rounded-full mb-4">
    <i data-lucide="{{ icon|default:'inbox' }}" class="w-8 h-8 text-slate-400"></i>
  </div>
  <h3 class="font-semibold text-slate-700">{{ title }}</h3>
  {% if description %}
    <p class="text-sm text-slate-500 mt-1 max-w-sm">{{ description }}</p>
  {% endif %}
</div>
